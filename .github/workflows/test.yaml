name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  cpu-test:
    if: github.repository_owner == 'meta-pytorch'
    name: CPU tests
    runs-on: linux.4xlarge
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Test
        run: uv run pytest tests/ -v -m "not gpu and not multi_gpu"

  gpu-test:
    if: github.repository_owner == 'meta-pytorch'
    name: GPU tests
    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      timeout: 60
      runner: linux.g5.12xlarge.nvidia.gpu
      gpu-arch-type: cuda
      gpu-arch-version: "13.0"
      script: |
        set -ex
        pip install uv
        uv sync --locked
        uv run pytest tests/ -v -rs
