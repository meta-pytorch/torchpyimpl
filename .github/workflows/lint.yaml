name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    if: github.repository_owner == 'meta-pytorch'
    name: lintrunner
    runs-on: linux.4xlarge
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Install lint dependencies
        run: uv run lintrunner init
      - name: Lint
        run: uv run lintrunner --force-color --all-files -v
