name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    if: github.repository_owner == 'meta-pytorch'
    name: lintrunner
    runs-on: linux.4xlarge
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - name: Install dependencies
        run: uv sync --locked
      - name: Install lint dependencies
        run: uv run lintrunner init
      - name: Lint
        run: uv run lintrunner --force-color --all-files -v
