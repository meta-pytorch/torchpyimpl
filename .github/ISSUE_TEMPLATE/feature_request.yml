name: Feature request
description: Ask for a new feature or a change to an API.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Tell us what you want to do and why the current API does not let you do it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Tell us how the feature must work. Give an example of the API, if you can.
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: Related PyTorch work
      description: Give links to related PyTorch issues, pull requests or documentation.
